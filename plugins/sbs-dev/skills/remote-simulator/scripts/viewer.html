<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Remote Simulator</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui; background: #151515; color: #eee; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; align-items: center; }
  header { padding: max(12px,env(safe-area-inset-top)) 12px 8px; text-align: center; }
  #screen { flex: 1; min-height: 0; width: 100%; position: relative; overflow: hidden; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; touch-action: none; user-select: none; }
  footer { padding: 10px 12px max(12px,env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  button { font: inherit; background: #333; border: 0; border-radius: 8px; padding: 12px; color: inherit; }
  #state { font-size: 12px; color: #bbb; }
</style>
<header><div id="name">Remote Simulator</div><div id="state" role="status">Connecting…</div></header>
<main id="screen"><img id="image" alt="Live simulator screen" draggable="false"></main>
<footer><button id="home">Home</button><button id="rotate">Rotate</button><button id="reconnect">Reconnect</button></footer>
<script src="/viewer.js"></script>
</html>
